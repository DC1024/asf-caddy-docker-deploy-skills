# ASF (ArchiSteamFarm) + Caddy 反代 一体化部署 compose
# 镜像: sffxzzp/asfcn (amd64), CN 友好, 走阿里云源
#   registry.cn-hangzhou.aliyuncs.com/sffxzzp/asfcn:latest
#
# 关键点:
#   - entrypoint 会把 steamcommunity.com / store.steampowered.com / api.steampowered.com /
#     github.com 写入容器 /etc/hosts 指向 127.0.0.1, 让这些域名走本地 Caddy 反代
#   - 默认 IPC 密码: asfcnasfcn (改 config/IPC.config)
#   - /app/Caddyfile 必须 bind mount 持久化, 否则 entrypoint 每次覆盖内置文件
#
# 端口:
#   1242  = ASF-ui / IPC (用户名默认 ASF, 密码见 IPC.config)
#   443   = Caddy 反代 (自签证书)

services:
  asf:
    image: registry.cn-hangzhou.aliyuncs.com/sffxzzp/asfcn:latest
    container_name: asf
    shm_size: 256mb
    ports:
      - 1242:1242
      - 443:443
    volumes:
      # 按需替换为你的宿主机数据路径
      - /path/to/asf/config:/app/config
      - /path/to/asf/logs:/app/logs
      - /path/to/asf/plugins:/app/plugins
      - /path/to/asf/Caddyfile:/app/Caddyfile
    restart: unless-stopped
